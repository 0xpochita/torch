# Test-only NEP-171/178/199 collection used by the market sandbox tests.
[package]
name = "mock-nft"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"

# Standalone: not a member of any parent workspace.
[workspace]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
