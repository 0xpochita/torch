[workspace]
resolver = "2"
# Every folder here with a Cargo.toml is a contract crate (mock-ft, collection, vault, market, gacha).
members = ["*"]
exclude = ["target"]

[workspace.dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
