version: 2
updates:
  - package-ecosystem: npm
    directory: /monorepo
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /monorepo/contracts/torch
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
